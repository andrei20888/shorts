<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmic Scale — YouTube Banner 2560×1440</title>
<style>
  :root{
    --void:#05070D; --void-2:#0A1020; --nebula:#141B3A;
    --cosmic:#2F7BFF; --cosmic-deep:#0A3D91; --ice:#5CC8FF; --lumen:#F2F7FF; --muted:#8CA0C8;
    --solar:#FFB54A; --ember:#FF5A3C;
  }
  html,body{margin:0;padding:0;background:var(--void);}
  #stage{position:relative;width:2560px;height:1440px;overflow:hidden;background:var(--void);}
  canvas{position:absolute;left:0;top:0;display:block;}
  .txt{position:absolute;left:0;width:2560px;text-align:center;white-space:nowrap;}
  #title{
    top:516px;
    font:900 134px/1 "Inter Display","Inter",system-ui,sans-serif;
    letter-spacing:-0.022em; text-transform:uppercase; color:var(--lumen);
    text-shadow:
      0 0 2px rgba(242,247,255,.9),
      0 0 14px rgba(92,200,255,.55),
      0 0 42px rgba(47,123,255,.50),
      0 0 110px rgba(47,123,255,.35);
  }
  #title .k{color:#CFEBFF;}
  #tag{
    top:672px;
    font:500 38px/1 "Inter",system-ui,sans-serif; letter-spacing:0.01em; color:var(--muted);
    text-shadow:0 0 18px rgba(10,61,145,.9);
  }
  #tag .dot{color:var(--ice);margin:0 .35em;text-shadow:0 0 10px rgba(92,200,255,.9);}
  .lbl{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;font-family:"JetBrains Mono",monospace;}
  .lbl .n{display:block;font-size:15px;line-height:16px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}
  .lbl .v{display:block;margin-top:11px;font-size:19px;line-height:20px;color:var(--lumen);font-weight:500;}
  .lbl .v sup{font-size:12px;line-height:0;position:relative;top:-.42em;margin-left:.04em;}
  .lbl .v .u{color:var(--muted);margin-left:.25em;}
  /* safe-area guides (only with ?guides=1) */
  #guides{display:none;position:absolute;inset:0;font-family:"JetBrains Mono",monospace;font-size:22px;}
  #guides.on{display:block;}
  .g{position:absolute;box-sizing:border-box;border:2px dashed;}
  .g span{position:absolute;left:8px;top:-30px;padding:2px 8px;background:rgba(5,7,13,.85);border-radius:4px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="2560" height="1440"></canvas>
  <div id="title" class="txt">Cosmic <span class="k">Scale</span></div>
  <div id="tag" class="txt">From quarks to black holes<span class="dot">·</span>new Shorts daily</div>
  <div id="labels"></div>
  <div id="guides">
    <div class="g" style="left:0;top:508px;width:2560px;height:423px;border-color:#5CC8FF"><span style="color:#5CC8FF">DESKTOP MIN · 2560×423</span></div>
    <div class="g" style="left:352px;top:508px;width:1855px;height:423px;border-color:#FFB54A"><span style="color:#FFB54A;left:auto;right:8px">TABLET · 1855×423</span></div>
    <div class="g" style="left:507px;top:508px;width:1546px;height:423px;border-color:#FF5A3C"><span style="color:#FF5A3C;top:auto;bottom:-32px">SAFE AREA · 1546×423 (all devices, incl. mobile)</span></div>
    <div class="g" style="left:0;top:0;width:2560px;height:1440px;border-color:rgba(140,160,200,.6)"><span style="color:#8CA0C8;top:8px">TV · 2560×1440 (full upload)</span></div>
  </div>
</div>
<script>
(async function(){
  const W=2560, H=1440;
  const cv=document.getElementById('bg'); const ctx=cv.getContext('2d');
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  const rnd=mulberry32(777031);
  const VOID='#05070D', VOID2='#0A1020', NEB='#141B3A', COS='#2F7BFF', DEEP='#0A3D91', ICE='#5CC8FF', LUM='#F2F7FF', MUTED='#8CA0C8', SOLAR='#FFB54A', EMBER='#FF5A3C';
  function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
  const TAU=Math.PI*2;

  // ------------------------------------------------------------ background
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,VOID); g.addColorStop(0.62,VOID2); g.addColorStop(1,VOID);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  function blob(x,y,r,color,a,sx=1,sy=1,rot=0){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sx,sy);
    const gg=ctx.createRadialGradient(0,0,0,0,0,r);
    gg.addColorStop(0,rgba(color,a)); gg.addColorStop(0.5,rgba(color,a*0.42)); gg.addColorStop(1,rgba(color,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill(); ctx.restore();
  }
  // nebula
  blob(1900,330,820,NEB,0.95,1.25,0.8,-0.3);
  blob(560,520,900,DEEP,0.26,1.3,0.9,0.2);
  blob(1280,760,980,COS,0.085,1.5,0.55,0);
  blob(330,240,560,NEB,0.9,1,1,0);
  blob(2300,1000,600,DEEP,0.22,1.2,0.7,0.4);
  blob(900,1150,700,NEB,0.7,1.6,0.5,0);

  // galaxy (decorative, top-right, outside safe area)
  (function galaxy(cx,cy,rot,scale){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); ctx.scale(scale,scale*0.42);
    let gg=ctx.createRadialGradient(0,0,0,0,0,210);
    gg.addColorStop(0,rgba(LUM,0.55)); gg.addColorStop(0.18,rgba(ICE,0.22)); gg.addColorStop(0.5,rgba(COS,0.10)); gg.addColorStop(1,rgba(COS,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,210,0,TAU); ctx.fill();
    for(let arm=0;arm<2;arm++){
      const off=arm*Math.PI;
      for(let t=0.2;t<3.4*Math.PI;t+=0.012){
        const r=9*Math.exp(0.205*t); if(r>230)break;
        const jitter=(rnd()-0.5)*r*0.22;
        const x=Math.cos(t+off)*(r+jitter), y=Math.sin(t+off)*(r+jitter);
        const a=Math.max(0,0.75-r/260)*(0.35+rnd()*0.65);
        ctx.fillStyle=rnd()<0.25?rgba(ICE,a):rgba(LUM,a);
        ctx.beginPath(); ctx.arc(x,y,0.7+rnd()*1.3,0,TAU); ctx.fill();
      }
    }
    gg=ctx.createRadialGradient(0,0,0,0,0,40);
    gg.addColorStop(0,rgba(LUM,0.95)); gg.addColorStop(1,rgba(LUM,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,40,0,TAU); ctx.fill();
    ctx.restore();
  })(2135,300,-0.5,1.0);

  // stars
  for(let i=0;i<1700;i++){
    const x=rnd()*W, y=rnd()*H*0.78;
    if(y>868 && y<936 && x>530 && x<2000) continue;
    const s=0.35+Math.pow(rnd(),2.2)*1.7, a=0.15+rnd()*0.75;
    ctx.fillStyle=rnd()<0.22?rgba(ICE,a):rgba(LUM,a);
    ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fill();
  }
  // bright stars with cross flares
  for(let i=0;i<16;i++){
    const x=60+rnd()*(W-120), y=40+rnd()*620;
    if(y>470 && x>420 && x<2140) continue;
    const L=9+rnd()*16;
    ctx.save(); ctx.strokeStyle=rgba(LUM,0.7); ctx.lineWidth=1; ctx.shadowColor=rgba(ICE,0.9); ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(x-L,y); ctx.lineTo(x+L,y); ctx.moveTo(x,y-L); ctx.lineTo(x,y+L); ctx.stroke(); ctx.restore();
    const gg=ctx.createRadialGradient(x,y,0,x,y,10); gg.addColorStop(0,rgba(LUM,1)); gg.addColorStop(0.3,rgba(ICE,0.5)); gg.addColorStop(1,rgba(ICE,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,10,0,TAU); ctx.fill();
  }

  // ------------------------------------------------------------ grid floor
  (function grid(){
    const hy=1000, vx=1280;
    ctx.save();
    ctx.strokeStyle=rgba(COS,0.42); ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let i=-16;i<=16;i++){ const xb=vx+i*260; ctx.moveTo(vx,hy); ctx.lineTo(xb,H+40); }
    for(let k=1;k<=16;k++){ const y=hy+(H-hy)*Math.pow(k/16,2.1); ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
    // fade near horizon
    let gg=ctx.createLinearGradient(0,hy-2,0,hy+170);
    gg.addColorStop(0,rgba(VOID2,1)); gg.addColorStop(1,rgba(VOID2,0));
    ctx.fillStyle=gg; ctx.fillRect(0,hy-2,W,172);
    // fade at the bottom edge
    gg=ctx.createLinearGradient(0,1260,0,H);
    gg.addColorStop(0,rgba(VOID,0)); gg.addColorStop(1,rgba(VOID,0.8));
    ctx.fillStyle=gg; ctx.fillRect(0,1260,W,H-1260);
    // horizon glow
    gg=ctx.createLinearGradient(0,0,W,0);
    gg.addColorStop(0,rgba(ICE,0)); gg.addColorStop(0.5,rgba(ICE,0.35)); gg.addColorStop(1,rgba(ICE,0));
    ctx.strokeStyle=gg; ctx.lineWidth=2; ctx.shadowColor=rgba(COS,0.9); ctx.shadowBlur=18;
    ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();
    ctx.restore();
  })();

  // ------------------------------------------------------------ helpers
  function glow(x,y,r0,r1,color,a0){
    const gg=ctx.createRadialGradient(x,y,r0,x,y,r1);
    gg.addColorStop(0,rgba(color,a0)); gg.addColorStop(0.45,rgba(color,a0*0.35)); gg.addColorStop(1,rgba(color,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r1,0,TAU); ctx.fill();
  }
  function shade(x,y,r,{limb=0.6,term=0.5,spec=0.5,specColor='255,255,255'}={}){
    let gg=ctx.createRadialGradient(x,y,r*0.7,x,y,r);
    gg.addColorStop(0,'rgba(5,7,13,0)'); gg.addColorStop(0.72,`rgba(5,7,13,${limb*0.45})`); gg.addColorStop(1,`rgba(5,7,13,${limb})`);
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    gg=ctx.createRadialGradient(x+0.55*r,y+0.55*r,r*0.1,x+0.55*r,y+0.55*r,r*1.3);
    gg.addColorStop(0,`rgba(3,8,30,${term})`); gg.addColorStop(0.5,`rgba(3,8,30,${term*0.35})`); gg.addColorStop(1,'rgba(3,8,30,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    gg=ctx.createRadialGradient(x-0.42*r,y-0.44*r,0,x-0.42*r,y-0.44*r,r*0.45);
    gg.addColorStop(0,`rgba(${specColor},${spec})`); gg.addColorStop(0.4,`rgba(${specColor},${spec*0.25})`); gg.addColorStop(1,`rgba(${specColor},0)`);
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  function rim(x,y,r,color,a,w){
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-w*0.4,Math.PI*0.95,Math.PI*1.75);
    ctx.strokeStyle=rgba(color,a); ctx.lineWidth=w; ctx.shadowColor=rgba(color,0.9); ctx.shadowBlur=w*5; ctx.stroke(); ctx.restore();
  }
  function blueSphere(x,y,r){
    glow(x,y,r*0.9,r*2.3,COS,0.38); glow(x,y,r*0.95,r*1.3,ICE,0.5);
    const bg=ctx.createRadialGradient(x-0.36*r,y-0.36*r,r*0.02,x,y,r);
    bg.addColorStop(0,'#D2F0FF'); bg.addColorStop(0.16,ICE); bg.addColorStop(0.5,COS); bg.addColorStop(0.84,DEEP); bg.addColorStop(1,'#062256');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  function ringArc(x,y,a,b,tilt,t0,t1,width,alpha,bright,colors){
    const [c0,c1,c2]=colors;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
    const lg=ctx.createLinearGradient(-a,0,a,0);
    lg.addColorStop(0,rgba(c0,alpha*0.75)); lg.addColorStop(0.28,rgba(c1,alpha)); lg.addColorStop(0.55,rgba(bright?c2:c1,alpha)); lg.addColorStop(0.8,rgba(c1,alpha)); lg.addColorStop(1,rgba(c0,alpha*0.8));
    ctx.beginPath(); ctx.ellipse(0,0,a,b,0,t0,t1);
    ctx.strokeStyle=rgba(c1,alpha*0.5); ctx.lineWidth=width*2.2; ctx.shadowColor=rgba(c0,alpha); ctx.shadowBlur=22; ctx.globalAlpha=0.5; ctx.stroke();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.ellipse(0,0,a,b,0,t0,t1); ctx.strokeStyle=lg; ctx.lineWidth=width; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,a+width*0.42,b+width*0.42,0,t0,t1); ctx.strokeStyle=rgba(c2,alpha*(bright?0.7:0.3)); ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,a-width*0.12,b-width*0.12,0,t0,t1); ctx.strokeStyle=rgba(VOID,alpha*0.55); ctx.lineWidth=1.4; ctx.stroke();
    ctx.restore();
  }
  function clipCircle(x,y,r,fn){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip(); fn(); ctx.restore(); }
  function band(x,y,r,yc,h,color,a){
    const y0=y+yc*r-h*r/2, y1=y+yc*r+h*r/2;
    const gg=ctx.createLinearGradient(0,y0,0,y1);
    gg.addColorStop(0,rgba(color,0)); gg.addColorStop(0.25,rgba(color,a)); gg.addColorStop(0.75,rgba(color,a)); gg.addColorStop(1,rgba(color,0));
    ctx.fillStyle=gg; ctx.fillRect(x-r,y0,2*r,y1-y0);
  }

  // ------------------------------------------------------------ objects
  const ROW=792;
  const OBJ=[
    {name:'Quark',    x:600,  v:['10','-18']},
    {name:'Atom',     x:760,  v:['10','-10']},
    {name:'Earth',    x:940,  v:['1.3×10','7']},
    {name:'Jupiter',  x:1150, v:['1.4×10','8']},
    {name:'Saturn',   x:1400, v:['2.7×10','8']},
    {name:'Sun',      x:1665, v:['1.4×10','9']},
    {name:'TON 618',  x:1920, v:['4×10','14']},
  ];

  // axis
  (function axis(){
    const y=870, x0=556, x1=1968;
    ctx.save();
    const lg=ctx.createLinearGradient(x0,0,x1,0);
    lg.addColorStop(0,rgba(COS,0.05)); lg.addColorStop(0.08,rgba(COS,0.7)); lg.addColorStop(0.92,rgba(COS,0.7)); lg.addColorStop(1,rgba(COS,0.05));
    ctx.strokeStyle=lg; ctx.lineWidth=1.5; ctx.shadowColor=rgba(COS,0.8); ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    ctx.shadowBlur=0;
    for(const o of OBJ){
      ctx.strokeStyle=rgba(ICE,0.8); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(o.x,y); ctx.lineTo(o.x,y-12); ctx.stroke();
      const gg=ctx.createRadialGradient(o.x,y-12,0,o.x,y-12,7); gg.addColorStop(0,rgba(LUM,1)); gg.addColorStop(0.35,rgba(ICE,0.6)); gg.addColorStop(1,rgba(ICE,0));
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(o.x,y-12,7,0,TAU); ctx.fill();
      // faint drop line from object to tick
      ctx.save(); ctx.setLineDash([2,6]); ctx.strokeStyle=rgba(ICE,0.16); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(o.x,ROW+54); ctx.lineTo(o.x,y-16); ctx.stroke(); ctx.restore();
    }
    // arrow head at right end
    ctx.fillStyle=rgba(COS,0.8); ctx.beginPath(); ctx.moveTo(x1+2,y); ctx.lineTo(x1-10,y-5); ctx.lineTo(x1-10,y+5); ctx.closePath(); ctx.fill();
    ctx.restore();
  })();

  // 1 quark / particle
  (function(){ const x=600,y=ROW;
    glow(x,y,0,78,COS,0.32); glow(x,y,0,36,ICE,0.6);
    let gg=ctx.createRadialGradient(x,y,0,x,y,8); gg.addColorStop(0,rgba(LUM,1)); gg.addColorStop(0.6,rgba(LUM,0.9)); gg.addColorStop(1,rgba(ICE,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,8,0,TAU); ctx.fill();
    for(const [dx,dy] of [[-16,10],[14,-13]]){ glow(x+dx,y+dy,0,10,ICE,0.6); ctx.fillStyle=rgba(LUM,0.9); ctx.beginPath(); ctx.arc(x+dx,y+dy,2.2,0,TAU); ctx.fill(); }
  })();

  // 2 atom
  (function(){ const x=760,y=ROW, rx=30, ry=11;
    glow(x,y,0,60,COS,0.22);
    for(let i=0;i<3;i++){
      const rot=i*Math.PI/3+0.2;
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
      ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,TAU); ctx.strokeStyle=rgba(ICE,0.3); ctx.lineWidth=4; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,TAU); ctx.strokeStyle=rgba(ICE,0.85); ctx.lineWidth=1.4; ctx.stroke();
      const t=[0.9,2.7,4.9][i]; const ex=Math.cos(t)*rx, ey=Math.sin(t)*ry;
      const gg=ctx.createRadialGradient(ex,ey,0,ex,ey,8); gg.addColorStop(0,rgba(LUM,1)); gg.addColorStop(0.35,rgba(ICE,0.7)); gg.addColorStop(1,rgba(ICE,0));
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(ex,ey,8,0,TAU); ctx.fill();
      ctx.restore();
    }
    for(const [dx,dy,c] of [[-3.2,-2,LUM],[3.4,-1.6,ICE],[0,3.2,COS]]){
      const gg=ctx.createRadialGradient(x+dx-1.2,y+dy-1.2,0,x+dx,y+dy,4.6); gg.addColorStop(0,'#FFFFFF'); gg.addColorStop(0.5,c); gg.addColorStop(1,DEEP);
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x+dx,y+dy,4.6,0,TAU); ctx.fill();
    }
    glow(x,y,0,14,ICE,0.5);
  })();

  // 3 earth
  (function(){ const x=940,y=ROW,r=36;
    glow(x,y,r*0.9,r*1.9,COS,0.35);
    const og=ctx.createRadialGradient(x-0.38*r,y-0.38*r,r*0.05,x,y,r);
    og.addColorStop(0,'#9FE0FF'); og.addColorStop(0.25,ICE); og.addColorStop(0.6,COS); og.addColorStop(1,DEEP);
    ctx.fillStyle=og; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    clipCircle(x,y,r,()=>{
      // continents (stylised)
      const lands=[
        {cx:-0.30,cy:-0.25,s:0.42,rot:0.4},{cx:-0.05,cy:0.45,s:0.30,rot:-0.3},
        {cx:0.42,cy:-0.30,s:0.36,rot:0.9},{cx:0.55,cy:0.35,s:0.22,rot:0.2},{cx:0.05,cy:-0.72,s:0.26,rot:1.2}
      ];
      for(const L of lands){
        ctx.save(); ctx.translate(x+L.cx*r,y+L.cy*r); ctx.rotate(L.rot);
        ctx.beginPath();
        const n=9; for(let i=0;i<=n;i++){ const a=i/n*TAU; const rr=L.s*r*(0.7+0.5*Math.abs(Math.sin(a*2.3+L.rot*5))); const px=Math.cos(a)*rr*1.3, py=Math.sin(a)*rr*0.8; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath();
        const lg=ctx.createLinearGradient(-L.s*r,-L.s*r,L.s*r,L.s*r); lg.addColorStop(0,'#5FB86E'); lg.addColorStop(1,'#2A7A4C');
        ctx.fillStyle=lg; ctx.filter='blur(0.6px)'; ctx.fill(); ctx.restore();
      }
      // clouds
      ctx.filter='blur(1.4px)';
      for(let i=0;i<8;i++){
        const cx=x+(rnd()-0.5)*1.8*r, cy=y+(rnd()-0.5)*1.8*r;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate((rnd()-0.5)*0.9);
        ctx.fillStyle=`rgba(255,255,255,${0.35+rnd()*0.35})`;
        ctx.beginPath(); ctx.ellipse(0,0,6+rnd()*14,2.2+rnd()*3,0,0,TAU); ctx.fill(); ctx.restore();
      }
      ctx.filter='none';
    });
    shade(x,y,r,{limb:0.65,term:0.55,spec:0.45});
    // atmosphere
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r+1.5,0,TAU); ctx.strokeStyle=rgba(ICE,0.55); ctx.lineWidth=3; ctx.shadowColor=rgba(ICE,0.9); ctx.shadowBlur=12; ctx.stroke(); ctx.restore();
    rim(x,y,r,ICE,0.9,1.6);
  })();

  // 4 jupiter
  (function(){ const x=1150,y=ROW,r=56;
    glow(x,y,r*0.9,r*1.9,SOLAR,0.22);
    clipCircle(x,y,r,()=>{
      ctx.fillStyle='#D9BB8F'; ctx.fillRect(x-r,y-r,2*r,2*r);
      const B=[[-0.86,0.16,'#A86F43',0.95],[-0.6,0.12,'#EAD6B4',0.9],[-0.36,0.18,'#A4663B',0.95],[-0.08,0.14,'#F1DFC4',0.9],[0.16,0.2,'#B27A4B',0.95],[0.44,0.12,'#E6CDA8',0.9],[0.66,0.14,'#9B5F34',0.95],[0.9,0.14,'#C7A27A',0.9]];
      for(const [yc,h,c,a] of B) band(x,y,r,yc,h,c,a);
      // subtle turbulence streaks
      ctx.globalAlpha=0.25;
      for(let i=0;i<14;i++){ const yy=y+(rnd()-0.5)*1.9*r; ctx.fillStyle=rnd()<0.5?'#FFF4E0':'#7A4525'; ctx.beginPath(); ctx.ellipse(x+(rnd()-0.5)*r,yy,10+rnd()*30,1.2+rnd()*1.8,0,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;
      // great red spot
      ctx.save(); ctx.translate(x+0.24*r,y+0.3*r);
      ctx.beginPath(); ctx.ellipse(0,0,0.21*r,0.115*r,0,0,TAU); ctx.fillStyle='#E7A37F'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,0,0.165*r,0.085*r,0,0,TAU); ctx.fillStyle='#C9573A'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(-0.02*r,0,0.08*r,0.04*r,0,0,TAU); ctx.fillStyle='#E07B5E'; ctx.fill(); ctx.restore();
    });
    shade(x,y,r,{limb:0.7,term:0.6,spec:0.3,specColor:'255,245,225'});
    rim(x,y,r,SOLAR,0.7,1.6);
  })();

  // 5 ringed blue planet (the logo mark)
  (function(){ const x=1400,y=ROW,r=50; const a=r*2.2,b=r*0.6,tilt=-0.33;
    ringArc(x,y,a,b,tilt,Math.PI,TAU,r*0.17,0.42,false,[DEEP,COS,ICE]);
    blueSphere(x,y,r);
    clipCircle(x,y,r,()=>{
      const B=[[-0.7,0.18,ICE,0.28],[-0.35,0.14,DEEP,0.35],[0.0,0.16,ICE,0.22],[0.3,0.12,DEEP,0.4],[0.62,0.16,ICE,0.2]];
      for(const [yc,h,c,al] of B) band(x,y,r,yc,h,c,al);
    });
    shade(x,y,r,{limb:0.62,term:0.55,spec:0.6});
    rim(x,y,r,ICE,0.95,1.6);
    // ring shadow on planet
    clipCircle(x,y,r,()=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(tilt); ctx.beginPath(); ctx.ellipse(0,-r*0.13,a,b,0,0,Math.PI); ctx.strokeStyle='rgba(3,8,30,0.45)'; ctx.lineWidth=r*0.16; ctx.filter='blur(2px)'; ctx.stroke(); ctx.restore(); });
    ringArc(x,y,a,b,tilt,0,Math.PI,r*0.19,0.98,true,[DEEP,COS,LUM]);
  })();

  // 6 sun
  (function(){ const x=1665,y=ROW,r=50;
    glow(x,y,r*0.8,r*3.4,SOLAR,0.5);
    glow(x,y,r*0.9,r*1.7,'#FFE1A0',0.55);
    ctx.save(); ctx.translate(x,y); ctx.globalAlpha=0.16;
    for(let i=0;i<18;i++){ ctx.rotate(TAU/18); const L=r*(1.9+((i%3)*0.35)); const gg=ctx.createLinearGradient(0,0,L,0); gg.addColorStop(0,rgba(SOLAR,0.9)); gg.addColorStop(1,rgba(SOLAR,0)); ctx.fillStyle=gg; ctx.beginPath(); ctx.moveTo(0,-r*0.08); ctx.lineTo(L,0); ctx.lineTo(0,r*0.08); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    const cg=ctx.createRadialGradient(x-0.15*r,y-0.15*r,0,x,y,r);
    cg.addColorStop(0,'#FFFDF4'); cg.addColorStop(0.42,'#FFEDB4'); cg.addColorStop(0.8,SOLAR); cg.addColorStop(1,'#FF9A3C');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    // granulation
    clipCircle(x,y,r,()=>{ ctx.globalAlpha=0.18; for(let i=0;i<70;i++){ const px=x+(rnd()-0.5)*2*r, py=y+(rnd()-0.5)*2*r; ctx.fillStyle=rnd()<0.5?'#FFFFFF':'#FF8A3C'; ctx.beginPath(); ctx.arc(px,py,2+rnd()*5,0,TAU); ctx.fill(); } ctx.globalAlpha=1; });
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r+1,0,TAU); ctx.strokeStyle='rgba(255,236,180,0.9)'; ctx.lineWidth=2; ctx.shadowColor=rgba(SOLAR,1); ctx.shadowBlur=24; ctx.stroke(); ctx.restore();
  })();

  // 7 black hole (TON 618)
  (function(){ const x=1920,y=ROW,r=40; const a=r*2.75,b=r*0.72,tilt=-0.22;
    glow(x,y,r*0.6,r*3.6,COS,0.32); glow(x,y,r*0.9,r*2.0,ICE,0.35);
    const disk=(t0,t1,w,alpha)=>{
      ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
      const gg=ctx.createRadialGradient(0,0,r*1.0,0,0,a+w*0.5);
      gg.addColorStop(0,rgba(LUM,alpha)); gg.addColorStop(0.16,rgba(ICE,alpha)); gg.addColorStop(0.42,rgba(COS,alpha*0.85)); gg.addColorStop(0.72,rgba(DEEP,alpha*0.5)); gg.addColorStop(1,rgba(DEEP,0));
      // use the same gradient in the un-rotated frame (ellipse squashes it visually)
      ctx.beginPath(); ctx.ellipse(0,0,a,b,0,t0,t1); ctx.strokeStyle=gg; ctx.lineWidth=w; ctx.lineCap='butt'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,0,a*0.62,b*0.62,0,t0,t1); ctx.strokeStyle=rgba(LUM,alpha*0.9); ctx.lineWidth=w*0.22; ctx.shadowColor=rgba(ICE,1); ctx.shadowBlur=14; ctx.stroke();
      ctx.restore();
    };
    // back half of the disk (behind) + lensed arcs above/below
    disk(Math.PI,TAU,r*0.5,0.75);
    const lens=(rad,t0,t1,w,alpha)=>{ ctx.save(); const gg=ctx.createRadialGradient(x,y,rad-w*0.6,x,y,rad+w*0.6); gg.addColorStop(0,rgba(ICE,0)); gg.addColorStop(0.5,rgba(LUM,alpha)); gg.addColorStop(1,rgba(ICE,0)); ctx.strokeStyle=gg; ctx.lineWidth=w; ctx.shadowColor=rgba(ICE,0.9); ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(x,y,rad,t0,t1); ctx.stroke(); ctx.restore(); };
    lens(r*1.42,Math.PI*1.1,Math.PI*1.9,r*0.26,0.9);
    lens(r*1.26,Math.PI*0.18,Math.PI*0.82,r*0.12,0.3);
    // shadow + photon ring
    ctx.fillStyle='#02030A'; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r*1.03,0,TAU); ctx.strokeStyle=rgba(LUM,0.95); ctx.lineWidth=2.6; ctx.shadowColor=rgba(ICE,1); ctx.shadowBlur=10; ctx.stroke(); ctx.restore();
    // front half of the disk
    disk(0,Math.PI,r*0.58,1.0);
  })();

  // ------------------------------------------------------------ dither
  const img=ctx.getImageData(0,0,W,H), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(rnd()-0.5)*3.0; d[i]=Math.max(0,Math.min(255,d[i]+n)); d[i+1]=Math.max(0,Math.min(255,d[i+1]+n)); d[i+2]=Math.max(0,Math.min(255,d[i+2]+n)); }
  ctx.putImageData(img,0,0);

  // ------------------------------------------------------------ labels (HTML, crisp)
  const lab=document.getElementById('labels');
  for(const o of OBJ){
    const el=document.createElement('div'); el.className='lbl'; el.style.left=o.x+'px'; el.style.top='879px';
    el.innerHTML=`<span class="n">${o.name}</span><span class="v">${o.v[0]}<sup>${o.v[1]}</sup><span class="u">m</span></span>`;
    lab.appendChild(el);
  }
  if(new URLSearchParams(location.search).get('guides')==='1') document.getElementById('guides').classList.add('on');

  await document.fonts.load('900 134px "Inter Display"');
  await document.fonts.load('500 38px "Inter"');
  await document.fonts.load('500 19px "JetBrains Mono"');
  await document.fonts.ready;
  window.__ready=true;
})();
</script>
</body>
</html>
