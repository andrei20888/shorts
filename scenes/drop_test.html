  addOverlay(t0 + 1.75, 99, (t) => {
    const sc = t < 0.3 ? ease.outBack(clamp01(t / 0.3)) : 1;
    ctx.save(); ctx.translate(W / 2, 640); ctx.scale(sc, sc);
    txt('DID YOU GUESS RIGHT?', 0, 0, fitSize('DID YOU GUESS RIGHT?', 84, 980), { fill: '#fff', glow: BRAND.cyanHex, blur: 40, stroke: '#0b0d10', sw: 12 }); ctx.restore();
    if (t > 0.35) { const p = 1 + Math.sin((t - 0.35) * 10) * 0.04, a = clamp01((t - 0.35) / 0.2); ctx.save(); ctx.translate(W / 2, 780); ctx.scale(p, p); ctx.globalAlpha = a;
      ctx.fillStyle = BRAND.orangeHex; ctx.shadowColor = BRAND.orangeHex; ctx.shadowBlur = 30; roundRect(-400, -48, 800, 96, 18); ctx.fill(); ctx.shadowBlur = 0;
      txt('COMMENT YOUR NUMBER 👇', 0, 3, 46, { fill: '#121417' }); ctx.restore(); }
    if (t > 0.9) txt('I guessed 7… 😳', W / 2, 900, 42, { font: 'Chakra Petch', weight: 700, fill: 'rgba(255,255,255,0.85)', alpha: clamp01((t - 0.9) / 0.2), stroke: '#0b0d10', sw: 8 });
  });
}

// persistent HUD: progress cells + floor counter + speed
let brokenCount = 0, counterPop = 0;
function drawHUD(f) {
  const t = vt(f), meta = D.meta[f];
  const cw = 84, gap = 8, x0 = W / 2 - (10 * cw + 9 * gap) / 2, y = 150;
  const passed = passEv.filter(e => e.f <= f).length, triggered = trigEv.filter(e => e.f <= f).length;
  const hudA = clamp01((t - 1.2) / 0.35), hudY = (1 - ease.outCubic(hudA)) * -300;
  ctx.save(); ctx.translate(0, hudY); ctx.globalAlpha = hudA;
  FL.forEach((F, i) => {
    const x = x0 + i * (cw + gap), done = i < passed, cur = !done && i === Math.min(triggered, 9) && (!splashEv || f < splashEv.f);
    ctx.save(); ctx.globalAlpha = done ? 1 : cur ? 1 : 0.42;
    ctx.fillStyle = done ? F.color : 'rgba(10,12,15,0.7)'; ctx.strokeStyle = F.color; ctx.lineWidth = cur ? 5 : 2;
    if (cur) { ctx.shadowColor = F.color; ctx.shadowBlur = 16 + 10 * Math.sin(t * 12); }
    roundRect(x, y, cw, 62, 10); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = done ? '#101216' : F.color; ctx.font = `800 ${done ? 34 : 26}px Orbitron`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(done ? '✓' : String(i + 1), x + cw / 2, y + 33); ctx.restore();
  });
  if (passed !== brokenCount) { brokenCount = passed; counterPop = 1; }
  counterPop = Math.max(0, counterPop - 1 / FPS * 3);
  const sc = 1 + ease.outBack(1 - counterPop) * 0 + counterPop * 0.35;
  ctx.save(); ctx.translate(W / 2, 295); ctx.scale(sc, sc);
  txt(`FLOOR ${passed}/10`, 0, 0, 74, { fill: '#fff', glow: BRAND.cyanHex, blur: 24, stroke: '#0b0d10', sw: 10, alpha: hudA }); ctx.restore();
  const kmh = Math.round(meta[2]);
  txt(`${kmh}`, W / 2 - 40, 385, 70, { font: 'Chakra Petch', weight: 700, fill: kmh > 40 ? BRAND.orangeHex : '#9fe9ff', align: 'right', stroke: '#0b0d10', sw: 8, alpha: hudA });
  txt('km/h', W / 2 - 24, 393, 30, { font: 'Chakra Petch', weight: 600, fill: 'rgba(255,255,255,0.7)', align: 'left', spacing: 2, alpha: hudA });
  ctx.restore();
  // next material tag
  const nextI = Math.min(triggered, 9), NF = FL[nextI];
  if (triggered <= 9 && (!splashEv || f < splashEv.f) && t > 2.6) txt(`NEXT: ${NF.name}`, W / 2, 1430, 34, { font: 'Chakra Petch', weight: 700, fill: NF.color, spacing: 6, alpha: 0.9, stroke: '#0b0d10', sw: 6 });
  if (meta[1] < 0.8) txt('◉ SLOW-MO', 70, 1490, 30, { font: 'Chakra Petch', weight: 700, fill: '#ff3b3b', align: 'left', alpha: 0.6 + 0.4 * Math.sin(t * 20), spacing: 4 });
}
function drawOverlay(f) {
  const t = vt(f);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  if (flash > 0.01) { ctx.fillStyle = `rgba(255,240,225,${Math.min(0.85, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (redPulse > 0.01) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7); g.addColorStop(0, 'rgba(255,60,20,0)'); g.addColorStop(1, `rgba(255,60,20,${0.5 * redPulse})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  drawHUD(f);
  const act = overlays.filter(o => t - o.start >= 0 && t - o.start <= o.dur);
  const top = act.filter(o => o.center).sort((a, b) => b.start - a.start)[0];
  for (const o of act) if (!o.center || o === top) { const lt = t - o.start; o.draw(lt, lt / o.dur); }
  txt('@PhysicsSandbox3D', W / 2, 1560, 26, { font: 'Chakra Petch', weight: 600, fill: 'rgba(255,255,255,0.45)', spacing: 3 });
}

// ---------- per-frame update ----------
let holdOrbit = 0, azBase = 0.78;
function update(f) {
  const t = vt(f), dt = 1 / FPS, ts = D.meta[f][1], sdt = dt * ts;
  for (const e of evAt.get(f) || []) {
    const F = e.floor != null ? FL[e.floor] : null;
    if (e.type === 'break') { burst(e.x, F.top, e.z, 90 + e.floor * 10, F.color, 3 + e.speed * 0.35, 0.8, 1.5); ring(e.x, F.top + 0.05, e.z, F.color, 4, 0.6, 0.05); trauma = Math.min(1, trauma + 0.45 + e.floor * 0.05); punch = 1; if (e.floor >= 5) flash = 0.18; }
    if (e.type === 'hit' && e.s > 2) { burst(e.x, e.y - L.BALL_R * 0.6, e.z, Math.min(30, Math.round(e.s * 2)), F.color, 2 + Math.min(6, e.s * 0.3), 0.45, 0.5); trauma = Math.min(1, trauma + Math.min(0.25, e.s * 0.02)); }
    if (e.type === 'trigger' && F.hold) { trauma = 1; flash = 0.3; punch = 1; redPulse = e.floor === 9 ? 1 : 0.5; }
    if (e.type === 'rest') { redPulse = 1; }
    if (e.type === 'splash') { burst(e.x, L.LAVA_Y + 0.2, e.z, 500, '#ff8a2a', 9, 1.6, 6, 3); burst(e.x, L.LAVA_Y + 0.2, e.z, 200, '#ffe08a', 6, 1.2, 8, 3); ring(e.x, L.LAVA_Y + 0.1, e.z, '#ff6a13', 6, 1.2, 0.14); flash = 1; trauma = 1; }
  }
  if (f === START) { trauma = 0.7; }
  // ball
  const bd = body(f, 0); ball.position.set(bd[0], bd[1], bd[2]); ball.quaternion.set(bd[3], bd[4], bd[5], bd[6]);
  ball.visible = bd[1] > L.LAVA_Y - 0.9; ballLight.position.copy(ball.position); ballLight.intensity = ball.visible ? 3 + trauma * 3 : 0;
  // fragments
  FL.forEach((F, fi) => {
    const im = floorMeshes[fi];
    F.frags.forEach((bi, k) => {
      const d = body(f, bi + 1);
      if (d[1] < L.LAVA_Y - 0.6) { _s.setScalar(0.0001); } else _s.setScalar(1);
      _p.set(d[0], d[1], d[2]); _q.set(d[3], d[4], d[5], d[6]); _m.compose(_p, _q, _s); im.setMatrixAt(k, _m);
    });
    im.instanceMatrix.needsUpdate = true;
  });
  stepParticles(sdt); stepRings(dt);
  lavaMat.uniforms.uTime.value = t;
  const nearLava = clamp01(1 - (ball.position.y - L.LAVA_Y - 2) / 16);
  lavaLight.intensity = 3 + nearLava * 30; scene.fog.color.setRGB(0.03 + nearLava * 0.14, 0.035 + nearLava * 0.05, 0.047);

  // camera direction
  const holding = trigEv.some(e => FL[e.floor].hold && e.f <= f && !(breakEv.find(b => b.floor === e.floor && b.f <= f)));
  const after = splashEv && f >= splashEv.f;
  let tDist = ts < 0.8 ? 7.6 : 9.5, tElev = 0.62;
  if (t < 1.2) tDist = THREE.MathUtils.lerp(5.8, tDist, ease.inOut(clamp01(t / 1.2)));
  const tTarget = ball.position.clone();
  if (holding) { tDist = 7.0; holdOrbit += dt * 0.7; }
  if (after) { tTarget.set(0, L.LAVA_Y + 1.2, 0); tDist = 9.5; tElev = 0.95; }
  const sm = 1 - Math.pow(0.02, dt);
  camTarget.x += (tTarget.x - camTarget.x) * (f === 0 ? 1 : sm * 0.6); camTarget.z += (tTarget.z - camTarget.z) * (f === 0 ? 1 : sm * 0.6);
  camTarget.y += (tTarget.y - camTarget.y) * (f === 0 ? 1 : Math.min(1, sm * 1.8));
  if (f === 0) { camDist = tDist; camElev = tElev; }
  camDist += (tDist - camDist) * sm; camElev += (tElev - camElev) * sm;
  camAz = azBase + Math.sin(t * 0.3) * 0.22 + holdOrbit;
  const dist = camDist * (1 - punch * 0.06);
  cam.position.set(camTarget.x + Math.cos(camAz) * Math.cos(camElev) * dist, camTarget.y + Math.sin(camElev) * dist, camTarget.z + Math.sin(camAz) * Math.cos(camElev) * dist);
  camLook.copy(camTarget); camLook.y -= after ? 0.5 : 1.9;
  const sh = trauma * trauma * 0.3; cam.position.x += jj(-1, 1) * sh; cam.position.y += jj(-1, 1) * sh; cam.position.z += jj(-1, 1) * sh;
  cam.lookAt(camLook);
  trauma = Math.max(0, trauma - dt * 1.7); punch = Math.max(0, punch - dt * 3); flash = Math.max(0, flash - dt * 3.5); redPulse = Math.max(0, redPulse - dt * 1.4);
  key.position.set(camTarget.x - 5, camTarget.y + 9, camTarget.z + 6); key.target.position.copy(camTarget);
  finishPass.uniforms.uTime.value = t; finishPass.uniforms.uCA.value = 0.0012 + trauma * 0.004;
}

const from = Math.max(START, +(params.from || 0)), to = Math.min(N - 1, +(params.to || N - 1));
const stillFrame = params.frame != null ? +params.frame : null;
const last = stillFrame != null ? stillFrame : to;
for (let f = 0; f <= last; f++) {
  update(f);
  if (stillFrame != null) continue;
  if (f < from || (f - from) % STEP) continue;
  composer.render(); drawOverlay(f); await sendFrame(ctx);
}
if (stillFrame != null) { composer.render(); drawOverlay(stillFrame); document.body.replaceChildren(out); }
window.__done = true;
</script>
